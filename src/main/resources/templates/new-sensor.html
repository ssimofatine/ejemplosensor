<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>

<div class="container mt-3">
    <div class="d-flex flex-wrap align-items-center justify-content-center lg:justify-content-start">
        <ul class="nav col-12 lg:col-auto lg:me-auto mb-2 justify-content-center md:mb-0">
            <li><a th:href="@{/sensors}" class="nav-link px-2 theme-secondary">Sensores</a></li>
            <li><a href="#" class="nav-link px-2 theme-inverse">Clima</a></li>
        </ul>
        <form class="col-12 lg:col-auto mb-3 lg:mb-0 lg:me-3" role="search">
            <input type="search" class="form-control" placeholder="Search..." aria-label="Search">
        </form>
        <div class="text-end">
            <button type="button" class="btn btn-outline theme-secondary">Search</button>
        </div>
    </div>
</div>

<div class="container mt-3">

    <form style="max-width: 400px;" class="mx-auto p-3 border rounded"
          th:action="@{/sensors}" th:object="${sensor}" th:method="post"
    >
        <h4>Nuevo Sensor:</h4>
        <div class="mb-3 mt-6">
            <label for="name" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
        </div>
        <div class="mb-3">
            <label for="model" class="form-label">Modelo</label>
            <input type="text" class="form-control" id="model" th:field="*{model}" required>
        </div>
        <div class="mb-3">
            <label for="unidadMedida" class="form-label">Unidad de medida</label>
            <input type="text" class="form-control" id="unidadMedida" th:field="*{unidadMedida}" required>
        </div>
        <div class="mb-3">
            <label for="estado" class="form-label">Estado</label>
            <select class="form-control" id="estado" th:field="*{estado}">
                <option value="ACTIVO" selected>Activo</option>
                <option value="INACTIVO">Inactivo</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo</label>
            <select class="form-control" id="tipo" th:field="*{tipo}">
                <option value="TEMPERATURA" selected>Temperatura</option>
                <option value="HUMEDAD">Humedad</option>
                <option value="PH">Ph</option>
                <option value="AGUA">Agua</option>
            </select>
        </div>

        <div class="row g-2">
            <div class="md:col">
                <div class="mb-3">
                    <label for="latitud" class="form-label">Latitud</label>
                    <input type="text" class="form-control" id="latitud" th:field="*{latitud}" required>
                </div>
            </div>
            <div class="md:col">
                <div class="mb-3">
                    <label for="longitud" class="form-label">Longitud</label>
                    <input type="text" class="form-control" id="longitud" th:field="*{longitud}" required>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-solid theme-primary">Guardar</button>
    </form>

</div>



<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
