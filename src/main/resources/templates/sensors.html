<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>

    <div class="container mt-3">
        <div class="d-flex flex-wrap align-items-center justify-content-center lg:justify-content-start">
            <ul class="nav col-12 lg:col-auto lg:me-auto mb-2 justify-content-center md:mb-0">
                <li><a th:href="@{/sensors}" class="nav-link px-2 theme-secondary">Sensores</a></li>
                <li><a href="#" class="nav-link px-2 theme-inverse">Clima</a></li>
            </ul>
            <form class="col-12 lg:col-auto mb-3 lg:mb-0 lg:me-3" role="search">
                <input type="search" class="form-control" placeholder="Search..." aria-label="Search">
            </form>
            <div class="text-end">
                <button type="button" class="btn btn-outline theme-secondary">Search</button>
            </div>
        </div>
    </div>

    <div class="container mt-3">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mt-3">Lista de sensores</h5>
            <a  th:href="@{/sensors/new}" type="button" class="btn-solid theme-success ms-3" aria-label="Confirm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
                </svg>
            </a>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>NAME</th>
                    <th>TYPE</th>
                    <th>MODEL</th>
                    <th>ESTADO</th>
                    <th>LATITUD</th>
                    <th>LONGITUD</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="sensor : ${sensors}">
                    <td><a th:href="@{/sensors/{id}(id=${sensor.getId()})}" th:text="${sensor.getName()}"></a></td>
                    <td th:text="${sensor.getTipo()}"></td>
                    <td th:text="${sensor.getModel()}"></td>
                    <td th:text="${sensor.getEstado()}"></td>
                    <td th:text="${sensor.getLatitud()}"></td>
                    <td th:text="${sensor.getLongitud()}"></td>
                    <td>
                        <a class="btn-solid theme-danger" th:href="@{/sensors/delete/{id}(id=${sensor.getId()})}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash2-fill" viewBox="0 0 16 16">
                                <path d="M2.037 3.225A.7.7 0 0 1 2 3c0-1.105 2.686-2 6-2s6 .895 6 2a.7.7 0 0 1-.037.225l-1.684 10.104A2 2 0 0 1 10.305 15H5.694a2 2 0 0 1-1.973-1.671zm9.89-.69C10.966 2.214 9.578 2 8 2c-1.58 0-2.968.215-3.926.534-.477.16-.795.327-.975.466.18.14.498.307.975.466C5.032 3.786 6.42 4 8 4s2.967-.215 3.926-.534c.477-.16.795-.327.975-.466-.18-.14-.498-.307-.975-.466z"/>
                            </svg>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>



    </div>



    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
